[Profile]
# PrimeHack layout for a modern gamepad (DualSense / Xbox / MFi) on Metroid Prime 1 and 2 (GameCube).
# Left stick moves, right stick looks (PrimeHack camera).
# R2 fires, Cross jumps, Square = Morph Ball, Triangle = missile, L2 locks on, R1 = map.
# D-Pad changes beams (the game's C-Stick); hold L1 + D-Pad to change visors (the game's D-Pad).
# On the map, the right stick rotates it (as in Trilogy).
# "MFi/0/Select Device" is a placeholder: the app binds the controller you assign to this port.
Device = MFi/0/Select Device
Buttons/A = `R Trigger`
Buttons/B = `Button A`
Buttons/X = `Button X`
Buttons/Y = `Button Y`
Buttons/Z = `R Shoulder`
Buttons/Start = `Menu`
D-Pad/Up = `D-Pad Up` & `L Shoulder`
D-Pad/Down = `D-Pad Down` & `L Shoulder`
D-Pad/Left = `D-Pad Left` & `L Shoulder`
D-Pad/Right = `D-Pad Right` & `L Shoulder`
Main Stick/Up = `L Stick Y+`
Main Stick/Down = `L Stick Y-`
Main Stick/Left = `L Stick X-`
Main Stick/Right = `L Stick X+`
C-Stick/Up = `D-Pad Up` & !`L Shoulder`
C-Stick/Down = `D-Pad Down` & !`L Shoulder`
C-Stick/Left = `D-Pad Left` & !`L Shoulder`
C-Stick/Right = `D-Pad Right` & !`L Shoulder`
Triggers/L = `L Trigger`
Triggers/R = 
Triggers/L-Analog = `L Trigger`
Triggers/R-Analog = 
