[Profile]
# PrimeHack layout for a modern gamepad (DualSense / Xbox / MFi) on Metroid Prime 1 and 2 (GameCube).
# Left stick moves, right stick looks (PrimeHack camera). Hold L1 and push the right stick to
# change beams (the game's C-Stick). The D-Pad changes visors, as in the original game.
# "MFi/0/Select Device" is a placeholder: the app binds the controller you assign to this port.
Device = MFi/0/Select Device
Buttons/A = `R Trigger`
Buttons/B = `Button A`
Buttons/X = `Button B`
Buttons/Y = `Button X`
Buttons/Z = `Button Y`
Buttons/Start = `Menu`
D-Pad/Up = `D-Pad Up`
D-Pad/Down = `D-Pad Down`
D-Pad/Left = `D-Pad Left`
D-Pad/Right = `D-Pad Right`
Main Stick/Up = `L Stick Y+`
Main Stick/Down = `L Stick Y-`
Main Stick/Left = `L Stick X-`
Main Stick/Right = `L Stick X+`
Main Stick/Radius = 100,000000
C-Stick/Up = `R Stick Y+` & `L Shoulder`
C-Stick/Down = `R Stick Y-` & `L Shoulder`
C-Stick/Left = `R Stick X-` & `L Shoulder`
C-Stick/Right = `R Stick X+` & `L Shoulder`
C-Stick/Radius = 100,000000
Triggers/L = `L Trigger`
Triggers/R = `R Shoulder`
Triggers/L-Analog = `L Trigger`
Triggers/R-Analog = 
Triggers/Threshold = 90,000000
Rumble/Motor = `Rumble`
Camera Control/Up = `R Stick Y+` & !`L Shoulder`
Camera Control/Down = `R Stick Y-` & !`L Shoulder`
Camera Control/Left = `R Stick X-` & !`L Shoulder`
Camera Control/Right = `R Stick X+` & !`L Shoulder`
Camera Control/Reset Camera Pitch = `R Stick`
Camera Control/Radius = 100,000000
Camera Control/Horizontal Sensitivity = 45,000000
Camera Control/Vertical Sensitivity = 35,000000
PrimeHack/PrimeHackMode = 1
PrimeHack/Spring Ball = `L Stick`
PrimeHack/Camera Sensitivity = 15,000000
PrimeHack/Invert X Axis = False
PrimeHack/Invert Y Axis = False
