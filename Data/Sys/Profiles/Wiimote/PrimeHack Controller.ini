[Profile]
# PrimeHack layout for a modern gamepad (DualSense / Xbox / MFi) on Metroid Prime Trilogy (Wii).
# Left stick moves, right stick looks (PrimeHack camera; no pointer needed).
# R2 fires, Cross jumps, Square = Morph Ball, Triangle = missile, L2 locks on, R1 = map,
# Circle = grapple (Prime 3).
# D-Pad picks a beam; hold L1 and press the D-Pad to pick a visor.
# "MFi/0/Select Device" is a placeholder: the app binds the controller you assign to this slot.
Device = MFi/0/Select Device
Buttons/A = `R Trigger`
Buttons/B = `Button A`
Buttons/1 = `R Shoulder`
Buttons/2 = `Touchpad`
Buttons/- = `R Stick`
Buttons/+ = `Menu`
Buttons/Home = `Home`
D-Pad/Down = `Button Y`
Extension = Nunchuk
Nunchuk/Buttons/C = `Button X`
Nunchuk/Buttons/Z = `L Trigger`
Nunchuk/Stick/Up = `L Stick Y+`
Nunchuk/Stick/Down = `L Stick Y-`
Nunchuk/Stick/Left = `L Stick X-`
Nunchuk/Stick/Right = `L Stick X+`
Nunchuk/Stick/Radius = 100,000000
IMUIR/Enabled = False
Rumble/Motor = `Rumble`
PrimeHack/Beam 1 = `D-Pad Up` & !`L Shoulder`
PrimeHack/Beam 2 = `D-Pad Right` & !`L Shoulder`
PrimeHack/Beam 3 = `D-Pad Down` & !`L Shoulder`
PrimeHack/Beam 4 = `D-Pad Left` & !`L Shoulder`
PrimeHack/Visor 1 = `D-Pad Up` & `L Shoulder`
PrimeHack/Visor 2 = `D-Pad Right` & `L Shoulder`
PrimeHack/Visor 3 = `D-Pad Down` & `L Shoulder`
PrimeHack/Visor 4 = `D-Pad Left` & `L Shoulder`
PrimeHack/Spring Ball = `L Stick`
PrimeHack/Grapple Lasso = `Button B`
PrimeHack/Mode = 1
PrimeHack/Camera Sensitivity = 15,000000
PrimeHack/Invert X Axis = False
PrimeHack/Invert Y Axis = False
PrimeHack/Improved Motion Controls = True
Camera Control/Up = `R Stick Y+`
Camera Control/Down = `R Stick Y-`
Camera Control/Left = `R Stick X-`
Camera Control/Right = `R Stick X+`
Camera Control/Radius = 100,000000
Camera Control/Horizontal Sensitivity = 45,000000
Camera Control/Vertical Sensitivity = 35,000000
