# R3ME01 - Metroid Prime Trilogy

[OnFrame]
# Changes an idle loop that Dolphin is unable to detect, to one that it can detect.
#
# The loop waits for a vblank interrupt, spamming `OSYieldThread` in the meantime.
# The patch replaces the call to `VIWaitForRetrace`, which still executes the other threads,
# but sleeps instead of spinlocking when there is no thread to execute.
#
# PrimeHack for iPad: NTSC-U port of the R3MP01 patch (upstream Dolphin PR #14682). Same frame-
# limiter function in each DOL, located by its code and constants; OSYieldThread and
# VIWaitForRetrace matched by their SDK code. Each line only applies while the expected
# instruction is present (the sub-games share addresses).
#
# In order: Launcher, 1, 2, 3.
$Speed hack
0x8039AAF4:dword:0x48104F3D:0x480FAB29
0x8035361C:dword:0x4807DB11:0x48073EED
0x80371D94:dword:0x480920B1:0x4808848D
0x803E8B7C:dword:0x48108F09:0x480FEAF5

[OnFrame_Enabled]
$Speed hack
