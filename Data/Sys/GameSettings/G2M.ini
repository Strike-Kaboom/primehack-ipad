# G2ME01, G2MJ01, G2MP01 - Metroid Prime 2: Echoes

[Core]
CPUThread = False

[Video_Settings]
# PrimeHack for iPad: sharper by default on the iPad. 3x = 1920x1584 with 2x MSAA; the M5 GPU has
# plenty of headroom (these games are limited by the emulated CPU). A per-game choice in the app wins.
InternalResolution = 3
MSAA = 2
SafeTextureCacheColorSamples = 512
SuggestedAspectRatio = 2

# Because the minimap has a lot of unused triangles, 
# CPU Cull can greatly speed up demanding areas of the game.
CPUCull = True

[Video_Hacks]
# Required for "scan visor" to work.
EFBToTextureEnable = False

[Controls]
# PrimeHack for iPad: right-stick camera layout for a game controller on port 1. Applied only
# while this game runs, and only when port 1 is bound to a game controller.
PadProfile1 = PrimeHack Controller

[Video_Enhancements]
# PrimeHack for iPad: 16x anisotropic filtering (sharper floors and walls at an angle).
MaxAnisotropy = 4
