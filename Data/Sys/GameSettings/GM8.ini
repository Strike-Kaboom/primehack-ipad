# GM8E01, GM8J01, GM8P01 - Metroid Prime

[Video_Settings]
SafeTextureCacheColorSamples = 512
SuggestedAspectRatio = 2

# Because the minimap has a lot of unused triangles, 
# CPU Cull can greatly speed up demanding areas of the game.
CPUCull = True

[Controls]
# PrimeHack for iPad: right-stick camera layout for a game controller on port 1. Applied only
# while this game runs, and only when port 1 is bound to a game controller.
PadProfile1 = PrimeHack Controller
