# R3ME01, R3MP01 - Metroid Prime Trilogy

[Core]
# Values set here will override the main Dolphin settings.
SyncGPU = True
CPUThread = True
FastDiscSpeed = True
FPRF = False
MMU = False
DCBZ = False

[EmuState]
# The Emulation State. 1 is worst, 5 is best, 0 is not set.
EmulationStateId = 4
EmulationIssues = Disable PAL60 (EuRGB60) to avoid a black bar appearing.

[OnFrame]
# Add memory patches to be applied every frame here.

[ActionReplay]
# Add action replay cheats here.

[Video_Settings]
# Because the minimap has a lot of unused triangles, 
# CPU Cull can greatly speed up demanding areas of the game.
CPUCull = True

[Video_Hacks]

[Controls]
# PrimeHack for iPad: right-stick camera layout for a game controller on Wii Remote 1. Applied
# only while this game runs, and only when Wii Remote 1 is bound to a game controller.
WiimoteProfile1 = PrimeHack Controller
